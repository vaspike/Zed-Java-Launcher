name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: java-launcher
            asset_tar: java-launcher-${{ github.ref_name }}-darwin-arm64.tar.gz
            asset_zip: java-launcher-${{ github.ref_name }}-darwin-arm64.zip
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: java-launcher
            asset_tar: java-launcher-${{ github.ref_name }}-darwin-x86_64.tar.gz
            asset_zip: java-launcher-${{ github.ref_name }}-darwin-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: java-launcher
            asset_tar: java-launcher-${{ github.ref_name }}-linux-x86_64.tar.gz
            asset_zip: java-launcher-${{ github.ref_name }}-linux-x86_64.zip
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: java-launcher
            asset_tar: java-launcher-${{ github.ref_name }}-linux-arm64.tar.gz
            asset_zip: java-launcher-${{ github.ref_name }}-linux-arm64.zip
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: java-launcher.exe
            asset_zip: java-launcher-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          cp "${BIN_PATH}" "dist/${{ matrix.artifact_name }}"
          (cd dist && tar -czf "${{ matrix.asset_tar }}" "${{ matrix.artifact_name }}")
          (cd dist && zip -q "${{ matrix.asset_zip }}" "${{ matrix.artifact_name }}")
        shell: bash

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cd dist
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_zip }}
        shell: pwsh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
